<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 760" width="1000" height="760" role="img" aria-label="Illustration of a FreightBridge fulfillment warehouse with pallet racking, a forklift and loading bays">
  <defs>
    <linearGradient id="wWall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0B1524"/>
      <stop offset="100%" stop-color="#152134"/>
    </linearGradient>
    <linearGradient id="wFloor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#22334C"/>
      <stop offset="100%" stop-color="#0B1524"/>
    </linearGradient>
    <linearGradient id="wLight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8DAAFF" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#8DAAFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="wBay" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFB37A"/>
      <stop offset="100%" stop-color="#FF5C0A"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="760" fill="url(#wWall)"/>

  <!-- Roof trusses -->
  <g stroke="#22334C" stroke-width="6" fill="none" stroke-linecap="round">
    <path d="M0 96h1000"/>
    <path d="M60 96l60 46M180 96l-60 46M300 96l60 46M420 96l-60 46M540 96l60 46M660 96l-60 46M780 96l60 46M900 96l-60 46"/>
    <path d="M0 142h1000"/>
  </g>

  <!-- Overhead lights -->
  <g>
    <rect x="176" y="146" width="80" height="12" rx="6" fill="#DCE6FF"/>
    <path d="M156 158h120l60 150H96z" fill="url(#wLight)"/>
    <rect x="476" y="146" width="80" height="12" rx="6" fill="#DCE6FF"/>
    <path d="M456 158h120l60 150H396z" fill="url(#wLight)"/>
    <rect x="776" y="146" width="80" height="12" rx="6" fill="#DCE6FF"/>
    <path d="M756 158h120l60 150H696z" fill="url(#wLight)"/>
  </g>

  <!-- Loading bay doors -->
  <g>
    <rect x="40" y="250" width="150" height="200" rx="8" fill="#0B1524" stroke="#334765" stroke-width="4"/>
    <rect x="810" y="250" width="150" height="200" rx="8" fill="#101F45" stroke="#334765" stroke-width="4"/>
    <rect x="826" y="266" width="118" height="168" rx="4" fill="url(#wBay)" opacity="0.55"/>
    <g stroke="#334765" stroke-width="3">
      <path d="M40 296h150M40 342h150M40 388h150"/>
    </g>
  </g>

  <!-- Pallet racking -->
  <g>
    <!-- rack frames -->
    <g stroke="#4A5F80" stroke-width="8" stroke-linecap="round">
      <path d="M230 210v340M470 210v340M700 210v340"/>
      <path d="M230 300h240M230 400h240M230 500h240"/>
      <path d="M470 300h230M470 400h230M470 500h230"/>
    </g>

    <!-- pallets and cartons -->
    <g>
      <rect x="248" y="248" width="88" height="48" rx="4" fill="#D1450A"/>
      <rect x="350" y="256" width="100" height="40" rx="4" fill="#C73206"/>
      <rect x="248" y="352" width="70" height="44" rx="4" fill="#0F6E5A"/>
      <rect x="332" y="344" width="118" height="52" rx="4" fill="#152FB8"/>
      <rect x="248" y="450" width="110" height="46" rx="4" fill="#C73206"/>
      <rect x="372" y="446" width="78" height="50" rx="4" fill="#22334C"/>

      <rect x="490" y="252" width="94" height="44" rx="4" fill="#152FB8"/>
      <rect x="598" y="244" width="82" height="52" rx="4" fill="#0F6E5A"/>
      <rect x="490" y="348" width="72" height="48" rx="4" fill="#C73206"/>
      <rect x="576" y="352" width="104" height="44" rx="4" fill="#1A3EE8"/>
      <rect x="490" y="448" width="120" height="48" rx="4" fill="#22334C"/>
      <rect x="624" y="452" width="56" height="44" rx="4" fill="#C73206"/>
    </g>

    <!-- carton seams -->
    <g stroke="#050B15" stroke-opacity="0.3" stroke-width="2">
      <path d="M292 248v48M400 256v40M292 352v44M391 344v52M303 450v46M537 252v44M639 244v52M526 348v48M628 352v44M550 448v48"/>
    </g>
  </g>

  <!-- Floor -->
  <rect y="550" width="1000" height="210" fill="url(#wFloor)"/>
  <rect y="548" width="1000" height="4" fill="#4A5F80" opacity="0.6"/>
  <g stroke="#FFB37A" stroke-opacity="0.35" stroke-width="4" stroke-dasharray="26 20" stroke-linecap="round">
    <path d="M0 640h1000"/>
  </g>

  <!-- Forklift -->
  <g>
    <ellipse cx="770" cy="700" rx="130" ry="14" fill="#050B15" opacity="0.6"/>
    <rect x="690" y="590" width="120" height="72" rx="10" fill="#FA5B0A"/>
    <rect x="704" y="556" width="66" height="42" rx="8" fill="#22334C"/>
    <rect x="712" y="564" width="50" height="26" rx="4" fill="#8DAAFF" opacity="0.8"/>
    <g stroke="#4A5F80" stroke-width="7" stroke-linecap="round">
      <path d="M700 540h74"/>
      <path d="M706 540v-8M768 540v-8"/>
    </g>
    <rect x="822" y="540" width="10" height="140" rx="5" fill="#9FAFC9"/>
    <path d="M832 668h72" stroke="#9FAFC9" stroke-width="10" stroke-linecap="round"/>
    <rect x="836" y="608" width="70" height="52" rx="4" fill="#D1450A"/>
    <circle cx="716" cy="676" r="26" fill="#0B1524" stroke="#4A5F80" stroke-width="6"/>
    <circle cx="794" cy="680" r="20" fill="#0B1524" stroke="#4A5F80" stroke-width="6"/>
  </g>

  <!-- Foreground pallets -->
  <g>
    <rect x="90" y="606" width="150" height="56" rx="5" fill="#152FB8"/>
    <rect x="90" y="662" width="150" height="16" rx="4" fill="#0B1524"/>
    <rect x="262" y="626" width="110" height="36" rx="5" fill="#C73206"/>
    <rect x="262" y="662" width="110" height="16" rx="4" fill="#0B1524"/>
    <g stroke="#050B15" stroke-opacity="0.3" stroke-width="2">
      <path d="M140 606v56M190 606v56M300 626v36M340 626v36"/>
    </g>
  </g>
</svg>
